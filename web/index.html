<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPIT Events</title>
<link rel="stylesheet" href="css/bauhaus.css">
</head>
<body>
<main>
  <section class="hero">
    <div class="wrap">
      <div>
        <p class="eyebrow" style="margin-bottom:18px">Student committees · One calendar</p>
        <h1>Events<br>at <em>SPIT.</em></h1>
        <p class="lead">Every approved event, workshop and talk on campus. Pick one. Register in a click.</p>
      </div>
      <div class="compose" aria-hidden="true"><div class="c1"></div><div class="c2"></div><div class="c3"></div><div class="c4"></div><div class="c5"></div></div>
    </div>
  </section>

  <section class="wrap">
    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
      <input type="search" id="q" placeholder="Search events or committees" aria-label="Search events">
    </div>
    <div id="list" class="grid g3"><div class="loading">Loading events</div></div>
  </section>
</main>
<script src="js/app.js"></script>
<script>
(async () => {
  const { $, esc, api, fmt, catStyle, shapeEl, fail } = App;
  await App.boot("events");
  let events = [], cat = "All", q = "", failed = false;

  try { events = await api("/events"); } catch (e) { failed = true; $("#list").innerHTML = ""; fail(e); }

  const cats = ["All", ...new Set(events.map((e) => e.category))];
  const filters = $("#filters");
  filters.innerHTML = cats.map((c) => {
    const s = c === "All" ? "" : shapeEl(catStyle(c).shape, "s-" + (catStyle(c).c === "white" ? "ink" : catStyle(c).c));
    return `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === cat}">${s}${esc(c)}</button>`;
  }).join("");
  filters.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    cat = b.dataset.cat;
    filters.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    draw();
  });
  $("#q").addEventListener("input", (ev) => { q = ev.target.value.trim().toLowerCase(); draw(); });

  function card(e) {
    const st = catStyle(e.category);
    const left = Number(e.seats_left);
    const seats = left <= 0 ? `<span class="chip red">Full</span>` : left <= 10 ? `<span class="chip yellow">${left} left</span>` : `${left} seats`;
    const shape = shapeEl(st.shape, st.c === "white" ? "s-ink" : "");
    return `<a class="card" href="event.html?id=${e.event_id}">
      <div class="card-top c-${st.c}">
        <div>${shape}<span class="cat upper">${esc(e.category)}</span></div>
        <div class="date"><b>${fmt.day(e.event_date)}</b><i>${fmt.mon(e.event_date)}</i></div>
      </div>
      <div class="card-body">
        <h3>${esc(e.title)}</h3>
        <p class="upper muted">${esc(e.committee)}</p>
        ${e.venues ? `<p>${esc(e.venues)}</p>` : `<p class="muted">Venue to be confirmed</p>`}
        <div class="card-meta"><span class="price">${fmt.money(e.fee)}</span><span>${seats}</span></div>
      </div></a>`;
  }

  function draw() {
    const rows = events.filter((e) => (cat === "All" || e.category === cat) &&
      (!q || (e.title + " " + e.committee + " " + (e.venues || "")).toLowerCase().includes(q)));
    $("#list").innerHTML = rows.length ? rows.map(card).join("")
      : `<div class="empty" style="grid-column:1/-1">${shapeEl("circle", "s-yellow lg")}<h2>Nothing here</h2><p class="muted" style="margin-top:10px">No open events match. Try another category.</p></div>`;
  }
  if (!failed) draw();
})();
</script>
</body>
</html>
